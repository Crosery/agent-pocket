name: deploy

# Tag-driven releases (docs/RELEASING.md). Pushing a branch never deploys.
#   vX.Y.Z-rc.N on a stage commit                         -> preview     prev.ap.crosery.com
#   vX.Y.Z on that same commit after main fast-forwards  -> production  ap.crosery.com (environment approval)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)deploy
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      origin: ${{ steps.plan.outputs.origin }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        run: bash deploy/release-plan.sh "${{ inputs.tag || github.ref_name }}" | tee -a "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ needs.plan.outputs.origin }}
    concurrency:
      group: deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.plan.outputs.environment }}
      ORIGIN: ${{ needs.plan.outputs.origin }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      # The game servers run on the home Arch; the HK VPS forwards DEPLOY_HOST:DEPLOY_PORT to its sshd.
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ap
    steps:
      - name: Deploy switch
        if: (needs.plan.outputs.environment == 'preview' && vars.DEPLOY_PREVIEW_ENABLED != 'enabled') || (needs.plan.outputs.environment == 'production' && vars.DEPLOY_PRODUCTION_ENABLED != 'enabled')
        run: echo "::error::DEPLOY_${ENVIRONMENT^^}_ENABLED is not 'enabled'" && exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy pillow
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          AP_PERF_SCALE: 3

      # Without an upload token the build stays same-origin instead of pointing at files that were never uploaded.
      - name: Static CDN switch
        env:
          BASE: ${{ vars.STATIC_CDN_BASE }}
          HAS_TOKEN: ${{ secrets.STATIC_CDN_UPLOAD_TOKEN != '' }}
        run: |
          if [ -n "$BASE" ] && [ "$HAS_TOKEN" = true ]; then echo "STATIC_CDN_BASE=$BASE" >> "$GITHUB_ENV"
          elif [ -n "$BASE" ]; then echo "::warning::STATIC_CDN_UPLOAD_TOKEN missing: building same-origin"; fi

      # Preview ships the devtools build (ADR 0002 §9): scenario links for acceptance on a phone. Production ships the plain
      # build and fails the deploy when the gate finds developer tooling in it.
      - name: Build
        run: |
          if [ "$ENVIRONMENT" = preview ]; then
            npm run build -- --mode devtools
            echo "DEVTOOLS=true" >> "$GITHUB_ENV"
          else
            npm run build
            npm run check:devgate
          fi
      - name: Release stamp
        run: node -e 'const e=process.env; require("fs").writeFileSync("dist/release.json", JSON.stringify({environment:e.ENVIRONMENT, version:e.VERSION, commit:e.SHA, devtools:e.DEVTOOLS==="true"}))'

      - name: Upload static assets to Qiniu CDN
        if: env.STATIC_CDN_BASE != ''
        env:
          STATIC_CDN_UPLOAD_TOKEN: ${{ secrets.STATIC_CDN_UPLOAD_TOKEN }}
        run: node scripts/static-cdn.ts upload && node scripts/static-cdn.ts verify

      - name: Ship release
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -p $DEPLOY_PORT -i $HOME/.ssh/deploy -o IdentitiesOnly=yes"
          R=/srv/ap/$ENVIRONMENT/releases/$SHA
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $R"
          rsync -az --delete -e "$SSH" src content dist deploy package.json package-lock.json "$DEPLOY_USER@$DEPLOY_HOST:$R/"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "bash $R/deploy/remote-deploy.sh $ENVIRONMENT $SHA"

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$ORIGIN/release.json" | tee /dev/stderr | grep -q "\"commit\":\"$SHA\""
          curl -fsS -o /dev/null -w "$ORIGIN -> %{http_code}\n" "$ORIGIN/"
