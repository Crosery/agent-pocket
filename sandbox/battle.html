<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>battle client sandbox · 智灵口袋</title>
  <style>
    @font-face { font-family: 'FusionPixel'; src: url('/assets/fonts/fusion-pixel-12px-zh_hans.woff2') format('woff2'); font-display: swap; }
    html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    #app { position: fixed; inset: 0; overflow: hidden; }
    #ap-canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; outline: none; }
    #ap-ui { position: absolute; inset: 0; pointer-events: none; }
    #ap-ui > * { pointer-events: auto; }
    #dev {
      position: fixed; left: 0; right: 0; top: 0; z-index: 100; display: flex; flex-wrap: wrap; justify-content: center;
      gap: 3px; padding: 3px; font: 11px/1.2 monospace; background: rgba(0, 0, 0, 0.35);
    }
    #dev button { font: 11px monospace; padding: 2px 6px; cursor: pointer; }
    #log { position: fixed; right: 4px; bottom: 4px; z-index: 100; color: #9fe6ff; font: 11px/1.3 monospace; white-space: pre; pointer-events: none; }
    #errors { position: fixed; left: 4px; bottom: 4px; right: 4px; z-index: 101; color: #ffb4b4; font: 12px/1.3 monospace; white-space: pre-wrap; pointer-events: none; }
    body.shot #dev, body.shot #log { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="ap-canvas"></canvas>
    <div id="ap-ui"></div>
  </div>
  <div id="dev"></div>
  <div id="log"></div>
  <div id="errors"></div>
  <script type="module" src="./battle.ts"></script>
</body>
</html>
