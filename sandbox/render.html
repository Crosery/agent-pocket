<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>render sandbox · 智灵口袋</title>
  <style>
    @font-face { font-family: 'Fusion Pixel'; src: url('/assets/fonts/fusion-pixel-12px-zh_hans.woff2') format('woff2'); }
    :root { --ap-font: 'Fusion Pixel', monospace; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { position: absolute; left: 0; top: 0; display: block; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    #hud { position: fixed; left: 8px; top: 8px; color: #e9e6ff; font: 12px/1.35 var(--ap-font); background: rgba(10, 8, 24, 0.6);
      padding: 6px 8px; border: 1px solid #4b4380; white-space: pre; pointer-events: none; z-index: 5; }
    #errors { position: fixed; left: 8px; bottom: 8px; right: 8px; color: #ffb4b4; font: 12px/1.3 monospace; white-space: pre-wrap; z-index: 6; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 14px var(--ap-font); z-index: 4; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas><div id="overlay"></div></div>
  <div id="hud"></div>
  <div id="loading">loading…</div>
  <div id="errors"></div>
  <script type="module" src="./render.ts"></script>
</body>
</html>
